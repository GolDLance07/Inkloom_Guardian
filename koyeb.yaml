name: inkloom-guardian-backend
services:
  - name: api
    type: web
    git:
      repository: github.com/GolDLance07/Inkloom_Guardian
      branch: main
      workdir: backend
    build:
      type: dockerfile
      dockerfile: Dockerfile
    ports:
      - port: 8000
        path: /
    routes:
      - path: /
        port: 8000
    regions:
      - fra
    scalings:
      - min: 1
        max: 1
    env:
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: LLM_MODEL
        value: gemini-3.6-flash
      - key: ENABLE_DEMO_SEED
        value: "true"
