services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inkloom-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://neondb_owner:npg_gY5pGvVqS3yC@ep-aged-frog-a10w5547-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
      - LLM_PROVIDER=gemini
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=gemini-3.6-flash
      - CORS_ORIGINS=*
      - ENABLE_DEMO_SEED=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    container_name: inkloom-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
